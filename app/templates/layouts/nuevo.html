{% extends "base.html" %}
{% block titulo %}Nueva plantilla{% endblock %}

{% block contenido %}
<div class="g1-page-header">
  <div>
    <nav class="g1-breadcrumb"><a href="{{ url_for('layouts.lista') }}">Plantillas</a> / <span>Nueva</span></nav>
    <h1 class="g1-page-title">Nueva plantilla</h1>
  </div>
</div>

<form method="post" class="g1-form" style="max-width: 720px;">
  <div class="g1-card">
    <div class="g1-card-header">
      <h3 class="g1-card-title"><i class="bi bi-palette"></i> Información</h3>
    </div>
    <div class="g1-card-body">
      <div class="row g-3">
        <div class="col-md-7">
          <label class="form-label required">Nombre</label>
          <input type="text" name="nombre" class="form-control" required autofocus
                 placeholder="Ej: Plantilla corporativa 2026">
        </div>
        <div class="col-md-5">
          <label class="form-label required">Tipo de documento</label>
          <select name="tipo" class="form-select" required>
            <option value="cotizacion" selected>Cotización</option>
            <option value="cuenta_cobro">Cuenta de cobro</option>
          </select>
        </div>
      </div>

      <div class="alert alert-info mt-3">
        <i class="bi bi-info-circle"></i>
        <div class="ms-2">Al crear la plantilla podrás diseñarla visualmente con bloques arrastrables (logo, texto, tabla, firma, QR, etc.).</div>
      </div>
    </div>
  </div>

  <div class="g1-form-actions">
    <a href="{{ url_for('layouts.lista') }}" class="btn btn-light">Cancelar</a>
    <button class="btn btn-primary">
      <i class="bi bi-arrow-right"></i> Continuar al editor
    </button>
  </div>
</form>
{% endblock %}
